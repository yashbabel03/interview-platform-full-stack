<!DOCTYPE html>
<html>
<head>
  <title>Interview Prep Pro</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: white;
      background: #0f172a;
      overflow-x: hidden;
    }

    /* animated gradient blobs */
    body::before, body::after {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;
      filter: blur(200px);
      z-index: -1;
    }

    body::before {
      background: #6366f1;
      top: -200px;
      left: -200px;
    }

    body::after {
      background: #22c55e;
      bottom: -200px;
      right: -200px;
    }

    .sidebar {
      width: 220px;
      height: 100vh;
      position: fixed;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      padding: 20px;
    }

    .sidebar h3 {
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      margin: 15px 0;
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .sidebar a:hover {
      color: #22c55e;
    }

    .main {
      margin-left: 240px;
      padding: 30px;
    }

    .hero {
      height: 220px;
      border-radius: 20px;
      background: url('https://images.unsplash.com/photo-1535223289827-42f1e9919769') center/cover;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      border-radius: 20px;
    }

    .hero span {
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 15px;
      padding: 20px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
    }

    input {
      border-radius: 10px !important;
      border: none !important;
    }

    button {
      border-radius: 10px !important;
    }

    .fade-in {
      animation: fade 1s ease-in-out;
    }

    @keyframes fade {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h3>🚀 PrepPro</h3>
  <a href="#">Dashboard</a>
  <a href="#">Questions</a>
  <a href="#">Progress</a>
</div>

<div class="main fade-in">

  <div class="hero mb-4">
    <span>Crack Interviews with Confidence 🚀</span>
  </div>

  <!-- Stats -->
  <div class="row mb-4">
    <div class="col-md-4"><div class="card">📘 Questions: 42</div></div>
    <div class="col-md-4"><div class="card">🔥 Streak: 7 days</div></div>
    <div class="col-md-4"><div class="card">⭐ Level: Intermediate</div></div>
  </div>

  <!-- Progress -->
  <div class="card mb-4">
    <h4>Progress</h4>
    <div class="progress">
      <div class="progress-bar bg-success" style="width: 75%">75%</div>
    </div>
  </div>

  <!-- Questions -->
  <div class="card mb-4">
    <h4>Trending Questions</h4>
    <ul>
      <li>Explain event loop in Node.js</li>
      <li>What is JWT authentication?</li>
      <li>Difference between SQL & NoSQL</li>
    </ul>
  </div>
  <div id="message" style="margin-top:10px;color:lightgreen;"></div>

  <!-- Auth -->
  <div class="row">
    <div class="col-md-6">
      <div class="card">
        <h3>Create Account</h3>
        <input id="username" class="form-control mb-2" placeholder="Username">
        <input id="email" class="form-control mb-2" placeholder="Email">
        <input id="password" type="password" class="form-control mb-2" placeholder="Password">
        <button class="btn btn-success w-100" onclick="register()">Register</button>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card">
        <h3>Login</h3>
        <input id="loginEmail" class="form-control mb-2" placeholder="Email">
        <input id="loginPassword" type="password" class="form-control mb-2" placeholder="Password">
        <button class="btn btn-primary w-100" onclick="login()">Login</button>
      </div>
    </div>
  </div>

</div>

<script>
    async function register() {
      try {
        const res = await fetch("http://localhost:3000/auth/register", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });

        const data = await res.text();
        document.getElementById("message").innerText = data;

      } catch (err) {
        document.getElementById("message").innerText = "Error connecting to server";
        console.log(err);
      }
    }

    async function login() {
      try {
        const res = await fetch("http://localhost:3000/auth/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            email: document.getElementById("loginEmail").value,
            password: document.getElementById("loginPassword").value
          })
        });

        const data = await res.text();

        if (data === "Login Success") {
          localStorage.setItem("user", "true");
          window.location.href = "dashboard.html";
        } else {
          document.getElementById("message").innerText = data;
        }

      } catch (err) {
        document.getElementById("message").innerText = "Error connecting to server";
        console.log(err);
      }
    }
    </script>

</body>
</html>
